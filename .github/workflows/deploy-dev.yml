name: Build & Deploy Dev to S3

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      # Descarga el archivo config.local.js desde el bucket dev si existe (opcional, o podrías gestionarlo de otra forma)
      - name: Restaurar config.local.js
        run: |
          aws s3 cp s3://porra-birreros-dev/config.local.js src/config.local.js || echo "No config.local.js found in S3"
        continue-on-error: true

      - name: Build (esbuild + Tailwind)
        env:
          PORRA_API_BASE: "https://dev.porra.manriquegarcia.com"
          PORRA_AI_URL: ${{ secrets.PORRA_AI_URL }}
        run: node build.mjs

      - name: Sincronizar dist/ con S3 (Dev)
        env:
          S3_BUCKET: "porra-birreros-dev"
        run: |
          aws s3 sync dist/ s3://$S3_BUCKET \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "*.gz" \
            --exclude "config.local.js"

          aws s3 cp dist/index.html s3://$S3_BUCKET/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidar CloudFront (Dev)
        env:
          CF_DIST_ID: "E3APQ3GX8WMS5"
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CF_DIST_ID" \
            --paths "/*"
