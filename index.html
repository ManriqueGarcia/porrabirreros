    *{box-sizing:border-box;}
    html,body{margin:0;min-height:100vh;color:#f0f0f5;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;letter-spacing:.01em;}
    html{background:#06060e;scroll-behavior:smooth;}
    body{background:transparent;}

    body::before{content:'';position:fixed;inset:0;background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(225,6,0,.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0,120,255,.08) 0%, transparent 50%),
      linear-gradient(180deg,rgba(6,6,14,.1) 0%,transparent 40%,rgba(6,6,14,.3) 100%);
      pointer-events:none;z-index:1;}
    body[data-porra-mode="futbol"]::before{background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34,197,94,.1) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 100%, rgba(34,197,94,.06) 0%, transparent 50%),
      linear-gradient(180deg,rgba(6,6,14,.1) 0%,transparent 40%,rgba(6,6,14,.3) 100%);}

    #bg-f1,#bg-futbol{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
    #bg-f1::after,#bg-futbol::after{content:'';position:absolute;inset:0;background:rgba(6,6,14,.72);z-index:1;}
    #root{position:relative;z-index:2;}

    body[data-porra-mode="f1"] #bg-f1{display:block} body[data-porra-mode="f1"] #bg-futbol{display:none}
    body[data-porra-mode="futbol"] #bg-f1{display:none} body[data-porra-mode="futbol"] #bg-futbol{display:block}

    /* === GLASSMORPHISM CORE === */
    .card,.hero,.sidebar{
      background:rgba(255,255,255,.04);
      backdrop-filter:blur(24px) saturate(1.4);
      -webkit-backdrop-filter:blur(24px) saturate(1.4);
      border:1px solid rgba(255,255,255,.08);
      border-radius:16px;
      box-shadow:0 8px 32px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.03),inset 0 1px 0 rgba(255,255,255,.06);
      transition:border-color .3s ease, box-shadow .3s ease;
    }
    .card:hover{
      border-color:rgba(255,255,255,.12);
      box-shadow:0 12px 40px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.05),inset 0 1px 0 rgba(255,255,255,.08);
    }

    body[data-porra-mode="f1"] .card,body[data-porra-mode="f1"] .sidebar{
      border-color:rgba(225,6,0,.10);
      box-shadow:0 8px 32px rgba(0,0,0,.35),0 0 0 1px rgba(225,6,0,.04),inset 0 1px 0 rgba(255,255,255,.06);
    }
    body[data-porra-mode="f1"] .card:hover{border-color:rgba(225,6,0,.22);}
    .hero{
      background:linear-gradient(135deg,rgba(225,6,0,.06) 0%,rgba(255,255,255,.02) 100%);
      backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);
      border-color:rgba(225,6,0,.15);
      box-shadow:0 6px 32px rgba(225,6,0,.08),inset 0 1px 0 rgba(255,255,255,.06);
    }

    body[data-porra-mode="futbol"] .card,body[data-porra-mode="futbol"] .hero,body[data-porra-mode="futbol"] .sidebar{
      border-color:rgba(34,197,94,.12);
      box-shadow:0 8px 32px rgba(0,0,0,.35),0 0 0 1px rgba(34,197,94,.05),inset 0 1px 0 rgba(255,255,255,.06);
    }
    body[data-porra-mode="futbol"] .card:hover{border-color:rgba(34,197,94,.25);}
    body[data-porra-mode="futbol"] .hero{
      background:linear-gradient(135deg,rgba(34,197,94,.06) 0%,rgba(255,255,255,.02) 100%);
      border-color:rgba(34,197,94,.2);
    }

    .sidebar{background:rgba(255,255,255,.03);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);}

    /* === NAV TABS === */
    .porra-nav{
      display:flex;flex-wrap:wrap;gap:4px;padding:4px;
      background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:14px;
    }
    .porra-nav button{
      padding:8px 14px;border-radius:10px !important;font-size:.8rem;font-weight:500;
      background:transparent !important;border:1px solid transparent !important;
      color:rgba(255,255,255,.55);transition:all .2s ease;white-space:nowrap;
    }

    .porra-nav button.nav-active{
      background:rgba(225,6,0,.18) !important;border-color:rgba(225,6,0,.25) !important;
      color:#fff !important;font-weight:600;box-shadow:0 2px 12px rgba(225,6,0,.1);
    }
    body[data-porra-mode="futbol"] .porra-nav button.nav-active{
      background:rgba(34,197,94,.18) !important;border-color:rgba(34,197,94,.25) !important;
      box-shadow:0 2px 12px rgba(34,197,94,.1);
    }
    .porra-nav .nav-special{
      background:rgba(16,185,129,.08) !important;border-color:rgba(16,185,129,.15) !important;
      color:rgba(16,185,129,.9);
    }
    .porra-nav .nav-special:hover{background:rgba(16,185,129,.15) !important;color:#fff;}

    /* === BUTTONS === */
    button,[type="button"],[type="submit"]{transition:all .2s ease;}

    /* === INPUTS & SELECTS === */
    select,.select{
      background:rgba(255,255,255,.92) !important;color:#111 !important;
      border:1px solid rgba(15,23,42,.15) !important;border-radius:10px !important;
      padding:8px 12px;transition:all .2s ease;box-shadow:0 1px 4px rgba(0,0,0,.06);
    }
    select:focus,.select:focus{
      border-color:rgba(225,6,0,.4) !important;
      box-shadow:0 0 0 3px rgba(225,6,0,.08),0 1px 4px rgba(0,0,0,.06);outline:none;
    }
    option{background:#fff;color:#111;}
    .select-strong{background:rgba(255,255,255,.95) !important;color:#0f172a !important;font-weight:600;font-size:.95rem;}
    input[type="password"],input[type="text"],input[type="number"],input[type="datetime-local"],textarea{
      border-radius:10px !important;transition:all .2s ease;
    }
    input:focus,textarea:focus{
      border-color:rgba(225,6,0,.4) !important;box-shadow:0 0 0 3px rgba(225,6,0,.08);outline:none;

    body[data-porra-mode="futbol"] input:focus,body[data-porra-mode="futbol"] textarea:focus,

      border-color:rgba(34,197,94,.4) !important;box-shadow:0 0 0 3px rgba(34,197,94,.08);
    }

    /* === TABLES === */
    table{border-collapse:separate;border-spacing:0;width:100%;}
    thead th{
      background:rgba(255,255,255,.05);backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(255,255,255,.08);
      font-weight:600;text-transform:uppercase;font-size:.65rem;letter-spacing:.08em;color:rgba(255,255,255,.45);
      padding:10px 12px;position:sticky;top:0;z-index:2;
    }
    tbody td{padding:10px 12px;vertical-align:middle;}
    tbody tr{transition:background .15s ease;border-bottom:1px solid rgba(255,255,255,.04);}
    tbody tr:hover{background:rgba(255,255,255,.04);}
    tbody tr:nth-child(even){background:rgba(255,255,255,.015);}
    tbody tr:nth-child(even):hover{background:rgba(255,255,255,.05);}

    /* === SCROLLBAR === */
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:10px;}
    ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2);}

    /* === MODALS glass === */
    .bg-white{
      background:rgba(255,255,255,.95) !important;backdrop-filter:blur(20px);
      border-radius:16px !important;box-shadow:0 24px 80px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.1);
    }

    /* === MISC === */
    .bg-neutral-900{background:rgba(255,255,255,.03) !important;}
    .border-white\/10{border-color:rgba(255,255,255,.05) !important;}
    .border-t.border-white\/10{border-color:rgba(255,255,255,.05) !important;}
    footer{opacity:.5;transition:opacity .3s ease;}
    footer:hover{opacity:1;}

    /* === SECTION TITLES === */
    .section-title{
      font-size:1.05rem;font-weight:700;letter-spacing:-.01em;
      background:linear-gradient(135deg,#fff 60%,rgba(255,255,255,.6));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;
    }

    /* === STATUS BADGES === */
    .badge{
      display:inline-flex;align-items:center;gap:4px;
      padding:3px 10px;border-radius:8px;font-size:.7rem;font-weight:600;
      letter-spacing:.02em;
    }
    .badge-red{background:rgba(225,6,0,.12);color:#ff6b6b;border:1px solid rgba(225,6,0,.2);}
    .badge-green{background:rgba(34,197,94,.12);color:#6ee7a0;border:1px solid rgba(34,197,94,.2);}
    .badge-amber{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.2);}

    /* === ANIMATIONS === */
    @keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .card,.hero,.sidebar{animation:fadeInUp .35s ease both;}
    .card:nth-child(2){animation-delay:.04s;}
    .card:nth-child(3){animation-delay:.08s;}
    .card:nth-child(4){animation-delay:.12s;}

    /* === RESPONSIVE === */
    @media(max-width:640px){
      .porra-nav{
        flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
        gap:3px;padding:3px;scrollbar-width:none;
      }
      .porra-nav::-webkit-scrollbar{display:none;}
      .porra-nav button{padding:7px 10px;font-size:.73rem;flex-shrink:0;}
    }
  </style>
