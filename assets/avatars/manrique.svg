  <ellipse cx="134" cy="111" rx="10" ry="10" fill="white"/>
  <ellipse cx="68" cy="112" rx="6" ry="7" fill="#3D5A1E"/>
  <ellipse cx="136" cy="112" rx="6" ry="7" fill="#3D5A1E"/>
  <circle cx="71" cy="109" r="3" fill="white"/>
  <circle cx="139" cy="109" r="3" fill="white"/>
