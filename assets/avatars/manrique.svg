<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <defs>
    <radialGradient id="ms" cx="50%" cy="38%" r="50%"><stop offset="0%" stop-color="#FFE0C0"/><stop offset="100%" stop-color="#D8A878"/></radialGradient>
    <linearGradient id="mh" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0067B1"/><stop offset="40%" stop-color="#FF8000"/><stop offset="100%" stop-color="#0067B1"/></linearGradient>
  </defs>
  <rect width="200" height="260" rx="22" fill="#081008"/>
