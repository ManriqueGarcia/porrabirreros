  <path d="M52 228 L50 242 L60 242 L58 228Z" fill="#A0C850" opacity=".35" stroke="#6B8E23" stroke-width="1"/>
  <path d="M47 232 Q55 226 63 232" stroke="#A0C850" stroke-width="1" fill="none" opacity=".4"/>
  <text x="100" y="256" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FF8000" text-anchor="middle" opacity=".9">Manrique</text>
</svg>
