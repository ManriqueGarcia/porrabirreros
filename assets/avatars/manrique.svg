  <circle cx="86" cy="150" r=".8" fill="#1a0f05" opacity=".25"/>
  <circle cx="100" cy="154" r=".8" fill="#1a0f05" opacity=".25"/>
  <circle cx="114" cy="150" r=".8" fill="#1a0f05" opacity=".25"/>
