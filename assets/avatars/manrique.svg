<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240">
  <defs>
    <linearGradient id="m-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#081828"/><stop offset="100%" stop-color="#0a0a14"/></linearGradient>
    <linearGradient id="m-helmet" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FFD700"/><stop offset="40%" stop-color="#0055A4"/><stop offset="100%" stop-color="#003870"/></linearGradient>
    <linearGradient id="m-suit" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#0055A4"/><stop offset="100%" stop-color="#003060"/></linearGradient>
    <radialGradient id="m-skin" cx="50%" cy="40%" r="55%"><stop offset="0%" stop-color="#FDDCB5"/><stop offset="100%" stop-color="#E8B896"/></radialGradient>
    <radialGradient id="m-cheek" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFAAAA" stop-opacity=".5"/><stop offset="100%" stop-color="#FFAAAA" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="220" height="240" rx="24" fill="url(#m-bg)"/>
  <rect x="8" y="8" width="204" height="224" rx="22" fill="none" stroke="#0055A4" stroke-width="1" opacity=".25"/>
  <!-- Asturias accent -->
  <rect x="8" y="210" width="204" height="5" rx="2.5" fill="#0055A4" opacity=".4"/>
  <rect x="8" y="217" width="204" height="4" rx="2" fill="#FFD700" opacity=".3"/>
  <!-- Body -->
  <path d="M70 175 Q70 160 85 155 L135 155 Q150 160 150 175 L150 205 Q150 215 110 215 Q70 215 70 205 Z" fill="url(#m-suit)"/>
  <rect x="70" y="165" width="70" height="5" rx="2.5" fill="#FFD700" opacity=".7"/>
  <path d="M110 155 L110 205" stroke="#002850" stroke-width=".8" opacity=".4"/>
  <!-- Cruz de la Victoria simplified on suit -->
  <line x1="104" y1="178" x2="116" y2="178" stroke="#FFD700" stroke-width="2" opacity=".6"/>
  <line x1="110" y1="172" x2="110" y2="184" stroke="#FFD700" stroke-width="2" opacity=".6"/>
  <!-- Arms - one waving! -->
  <ellipse cx="58" cy="175" rx="14" ry="10" fill="url(#m-suit)"/>
  <path d="M152 165 Q168 142 175 135 Q178 132 180 136 Q177 145 162 162" fill="#0055A4" stroke="#003060" stroke-width="1"/>
  <!-- Waving hand -->
  <circle cx="178" cy="133" r="8" fill="url(#m-skin)"/>
  <path d="M172 128 L175 122 M176 127 L178 121 M180 128 L182 123" stroke="url(#m-skin)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- BIG head -->
  <ellipse cx="110" cy="90" rx="56" ry="54" fill="url(#m-helmet)"/>
  <!-- Gold top of helmet (Asturias) -->
  <ellipse cx="110" cy="65" rx="44" ry="20" fill="#FFD700" opacity=".85"/>
  <!-- Cruz de la Victoria on helmet -->
  <line x1="100" y1="62" x2="120" y2="62" stroke="#0055A4" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="52" x2="110" y2="72" stroke="#0055A4" stroke-width="3" stroke-linecap="round"/>
  <circle cx="103" cy="55" r="2.5" fill="#0055A4" opacity=".6"/>
  <circle cx="117" cy="55" r="2.5" fill="#0055A4" opacity=".6"/>
  <!-- Helmet shine -->
  <ellipse cx="88" cy="58" rx="16" ry="7" fill="white" opacity=".15"/>
  <!-- Visor -->
  <path d="M62 82 Q62 70 110 68 Q158 70 158 82 L158 108 Q158 120 110 122 Q62 120 62 108 Z" fill="#0f172a" stroke="#1a1d26" stroke-width="1.5"/>
  <!-- Face - round and friendly -->
  <ellipse cx="110" cy="95" rx="38" ry="24" fill="url(#m-skin)"/>
  <!-- Big expressive eyes -->
  <ellipse cx="92" cy="89" rx="10" ry="11" fill="white"/>
  <ellipse cx="128" cy="89" rx="10" ry="11" fill="white"/>
  <ellipse cx="94" cy="90" rx="6" ry="7" fill="#3B2510"/>
  <ellipse cx="130" cy="90" rx="6" ry="7" fill="#3B2510"/>
  <circle cx="96" cy="87" r="3" fill="white"/>
  <circle cx="132" cy="87" r="3" fill="white"/>
  <circle cx="92" cy="93" r="1.5" fill="white" opacity=".4"/>
  <circle cx="128" cy="93" r="1.5" fill="white" opacity=".4"/>
  <!-- Excited eyebrows -->
  <path d="M80 76 Q92 70 102 76" stroke="#3B2510" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M118 76 Q128 70 140 76" stroke="#3B2510" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="110" cy="98" rx="4" ry="3" fill="#D4A574" opacity=".6"/>
  <!-- BIG excited grin -->
  <path d="M88 104 Q110 122 132 104" stroke="#5C3A20" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M92 106 Q110 118 128 106" fill="white" opacity=".9"/>
  <path d="M96 112 Q110 116 124 112" fill="#E88" opacity=".3"/>
  <!-- Cheeks -->
  <circle cx="78" cy="102" r="9" fill="url(#m-cheek)"/>
  <circle cx="142" cy="102" r="9" fill="url(#m-cheek)"/>
  <!-- Name -->
  <text x="110" y="230" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFD700" text-anchor="middle" opacity=".9">Manrique</text>
</svg>
