<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <defs>
    <radialGradient id="as" cx="50%" cy="38%" r="50%"><stop offset="0%" stop-color="#FFE0C0"/><stop offset="100%" stop-color="#D8A070"/></radialGradient>
    <linearGradient id="ah" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#DA121A"/><stop offset="50%" stop-color="#fff"/><stop offset="100%" stop-color="#FCDD09"/></linearGradient>
  </defs>
  <rect width="200" height="260" rx="22" fill="#080810"/>
  <!-- TINY body in racing suit -->
  <path d="M78 208 Q72 200 80 194 L120 194 Q128 200 122 208 L126 242 Q100 250 74 242Z" fill="#CC0000"/>
  <rect x="90" y="198" width="20" height="8" rx="2" fill="#FCDD09" opacity=".7"/>
  <text x="100" y="205" font-family="system-ui" font-size="6" font-weight="800" fill="#111" text-anchor="middle">TAXI</text>
  <ellipse cx="70" cy="204" rx="10" ry="7" fill="#CC0000"/>
  <ellipse cx="130" cy="204" rx="10" ry="7" fill="#CC0000"/>
  <!-- Neck thin -->
  <rect x="94" y="186" width="12" height="10" rx="3" fill="url(#as)"/>
  <!-- HELMET (huge, top half) -->
  <ellipse cx="100" cy="88" rx="72" ry="70" fill="url(#ah)"/>
  <ellipse cx="100" cy="58" rx="62" ry="38" fill="url(#ah)"/>
  <!-- Helmet shine -->
  <ellipse cx="78" cy="48" rx="22" ry="10" fill="white" opacity=".15"/>
  <!-- Visor opening (showing face) -->
  <path d="M38 80 Q38 68 100 65 Q162 68 162 80 L162 130 Q162 155 100 160 Q38 155 38 130Z" fill="#0a1520"/>
  <!-- Face in visor -->
  <ellipse cx="100" cy="118" rx="50" ry="38" fill="url(#as)"/>
  <!-- HUGE glasses (key feature - thin metallic) -->
  <rect x="52" y="100" width="38" height="28" rx="14" fill="rgba(180,210,240,.12)" stroke="#999" stroke-width="2.5"/>
  <rect x="110" y="100" width="38" height="28" rx="14" fill="rgba(180,210,240,.12)" stroke="#999" stroke-width="2.5"/>
  <path d="M90 113 L110 113" stroke="#999" stroke-width="2"/>
  <path d="M50 110 L38 106" stroke="#999" stroke-width="2"/>
  <path d="M150 110 L162 106" stroke="#999" stroke-width="2"/>
  <!-- Big eyes behind glasses -->
  <ellipse cx="71" cy="114" rx="10" ry="11" fill="white"/>
  <ellipse cx="129" cy="114" rx="10" ry="11" fill="white"/>
  <ellipse cx="73" cy="115" rx="6" ry="7" fill="#3D2B1F"/>
  <ellipse cx="131" cy="115" rx="6" ry="7" fill="#3D2B1F"/>
  <circle cx="76" cy="112" r="3" fill="white"/>
  <circle cx="134" cy="112" r="3" fill="white"/>
  <!-- Thin eyebrows (grey - old) -->
  <path d="M54 96 Q71 88 88 96" stroke="#aaa" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M112 96 Q129 88 146 96" stroke="#aaa" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Sharp pointed nose (cara afilada) -->
  <path d="M95 122 Q100 140 105 122" stroke="#B88050" stroke-width="2" fill="none"/>
  <ellipse cx="100" cy="136" rx="5" ry="2.5" fill="#C49060" opacity=".5"/>
  <!-- Sparse white hair peeking from helmet -->
  <path d="M42 82 Q44 76 50 74" stroke="#ddd" stroke-width="2" fill="none" opacity=".6"/>
  <path d="M158 82 Q156 76 150 74" stroke="#ddd" stroke-width="2" fill="none" opacity=".6"/>
  <path d="M44 90 Q42 86 45 80" stroke="#ccc" stroke-width="1.5" fill="none" opacity=".5"/>
  <path d="M156 90 Q158 86 155 80" stroke="#ccc" stroke-width="1.5" fill="none" opacity=".5"/>
  <!-- Big cheeky grin (afeitado, sin barba) -->
  <path d="M72 148 Q100 165 128 148" stroke="#6B4020" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M78 150 Q100 162 122 150" fill="white" opacity=".8"/>
  <!-- Rosy cheeks -->
  <circle cx="56" cy="136" r="10" fill="#E88080" opacity=".2"/>
  <circle cx="144" cy="136" r="10" fill="#E88080" opacity=".2"/>
  <!-- Chin line (cara afilada - pointed) -->
  <path d="M80 158 Q100 172 120 158" stroke="#C49060" stroke-width="1" fill="none" opacity=".3"/>
  <!-- Murcia flag on helmet -->
  <rect x="42" y="42" width="16" height="10" rx="2" fill="#DA121A" opacity=".6"/>
  <rect x="42" y="42" width="8" height="10" rx="2" fill="#FCDD09" opacity=".5"/>
  <text x="100" y="256" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FCDD09" text-anchor="middle" opacity=".9">Antonio</text>
</svg>
