<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240">
  <defs>
    <linearGradient id="af-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a0a0a"/><stop offset="100%" stop-color="#0a0a12"/></linearGradient>
    <linearGradient id="af-jersey" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#DA121A"/><stop offset="100%" stop-color="#A00E14"/></linearGradient>
    <linearGradient id="af-shorts" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#1a1a2e"/><stop offset="100%" stop-color="#0f0f1a"/></linearGradient>
    <radialGradient id="af-skin" cx="50%" cy="40%" r="55%"><stop offset="0%" stop-color="#F5D4B8"/><stop offset="100%" stop-color="#DDA882"/></radialGradient>
    <radialGradient id="af-cheek" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#F5A0A0" stop-opacity=".4"/><stop offset="100%" stop-color="#F5A0A0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="220" height="240" rx="24" fill="url(#af-bg)"/>
  <rect x="8" y="8" width="204" height="224" rx="22" fill="none" stroke="#CC0000" stroke-width="1" opacity=".2"/>
  <!-- Murcia + Cataluña accent -->
  <rect x="8" y="210" width="102" height="5" rx="2.5" fill="#DA121A" opacity=".4"/>
  <rect x="110" y="210" width="102" height="5" rx="2.5" fill="#FCDD09" opacity=".4"/>
  <rect x="8" y="217" width="204" height="4" rx="2" fill="#CC0000" opacity=".3"/>
  <!-- Shorts -->
  <rect x="78" y="192" width="26" height="20" rx="6" fill="url(#af-shorts)"/>
  <rect x="116" y="192" width="26" height="20" rx="6" fill="url(#af-shorts)"/>
  <!-- Body - Red jersey -->
  <path d="M70 160 Q70 148 85 143 L135 143 Q150 148 150 160 L150 195 Q150 200 110 200 Q70 200 70 195 Z" fill="url(#af-jersey)"/>
  <!-- Collar -->
  <path d="M95 143 Q110 150 125 143" stroke="#FCDD09" stroke-width="2.5" fill="none"/>
  <!-- Yellow accents on jersey -->
  <rect x="70" y="155" width="70" height="3" rx="1.5" fill="#FCDD09" opacity=".5"/>
  <!-- Castle detail (Murcia) on jersey -->
  <rect x="98" y="172" width="24" height="14" rx="2" fill="none" stroke="#FCDD09" stroke-width="1" opacity=".5"/>
  <rect x="102" y="170" width="3" height="4" rx="1" fill="#FCDD09" opacity=".4"/>
  <rect x="109" y="170" width="3" height="4" rx="1" fill="#FCDD09" opacity=".4"/>
  <rect x="116" y="170" width="3" height="4" rx="1" fill="#FCDD09" opacity=".4"/>
  <!-- Number -->
  <text x="110" y="165" font-family="system-ui,sans-serif" font-size="11" font-weight="900" fill="#FCDD09" text-anchor="middle" opacity=".5">7</text>
  <!-- Arms -->
  <ellipse cx="58" cy="165" rx="14" ry="10" fill="#CC0000"/>
  <ellipse cx="162" cy="165" rx="14" ry="10" fill="#DA121A"/>
  <!-- BIG head -->
  <ellipse cx="110" cy="80" rx="50" ry="48" fill="url(#af-skin)"/>
  <!-- Hair - short, dark -->
  <ellipse cx="110" cy="50" rx="44" ry="22" fill="#2D1B0E"/>
  <path d="M66 68 Q66 38 110 30 Q154 38 154 68" fill="#2D1B0E"/>
  <path d="M70 74 Q68 62 74 55" fill="#2D1B0E"/>
  <path d="M150 74 Q152 62 146 55" fill="#2D1B0E"/>
  <!-- Hair shine -->
  <ellipse cx="96" cy="44" rx="16" ry="7" fill="white" opacity=".06"/>
  <!-- Glasses -->
  <rect x="76" y="72" width="25" height="18" rx="9" fill="none" stroke="#444" stroke-width="2"/>
  <rect x="119" y="72" width="25" height="18" rx="9" fill="none" stroke="#444" stroke-width="2"/>
  <path d="M101 79 L119 79" stroke="#444" stroke-width="1.8"/>
  <!-- Eyes behind glasses -->
  <ellipse cx="89" cy="80" rx="7" ry="8" fill="white"/>
  <ellipse cx="131" cy="80" rx="7" ry="8" fill="white"/>
  <ellipse cx="90" cy="81" rx="4" ry="5" fill="#2D1B0E"/>
  <ellipse cx="132" cy="81" rx="4" ry="5" fill="#2D1B0E"/>
  <circle cx="92" cy="78" r="2" fill="white"/>
  <circle cx="134" cy="78" r="2" fill="white"/>
  <!-- Eyebrows -->
  <path d="M78 67 Q89 62 100 67" stroke="#2D1B0E" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M120 67 Q131 62 142 67" stroke="#2D1B0E" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="110" cy="88" rx="3" ry="2.5" fill="#C4956E" opacity=".7"/>
  <!-- Smart smile -->
  <path d="M95 96 Q110 104 125 96" stroke="#5C3A20" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->
  <circle cx="80" cy="90" r="7" fill="url(#af-cheek)"/>
  <circle cx="140" cy="90" r="7" fill="url(#af-cheek)"/>
  <!-- Football at feet -->
  <circle cx="110" cy="218" r="10" fill="white" stroke="#333" stroke-width="1"/>
  <path d="M105 213 L110 218 L115 213 M103 218 L110 224 L117 218" fill="none" stroke="#333" stroke-width=".8" opacity=".5"/>
  <!-- Name -->
  <text x="110" y="230" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FCDD09" text-anchor="middle" opacity=".9">Antonio</text>
</svg>
