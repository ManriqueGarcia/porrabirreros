<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240">
  <defs>
    <linearGradient id="t-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a0a0a"/><stop offset="100%" stop-color="#0a0a12"/></linearGradient>
    <linearGradient id="t-helmet" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#DA121A"/><stop offset="40%" stop-color="#C60B1E"/><stop offset="100%" stop-color="#FCDD09"/></linearGradient>
    <linearGradient id="t-suit-l" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#DA121A"/><stop offset="100%" stop-color="#A00E14"/></linearGradient>
    <linearGradient id="t-suit-r" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#C60B1E"/><stop offset="100%" stop-color="#8B0710"/></linearGradient>
    <radialGradient id="t-skin" cx="50%" cy="40%" r="55%"><stop offset="0%" stop-color="#F5D4B8"/><stop offset="100%" stop-color="#DDA882"/></radialGradient>
    <radialGradient id="t-cheek" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#F5A0A0" stop-opacity=".4"/><stop offset="100%" stop-color="#F5A0A0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="220" height="240" rx="24" fill="url(#t-bg)"/>
  <rect x="8" y="8" width="204" height="224" rx="22" fill="none" stroke="#DA121A" stroke-width="1" opacity=".2"/>
  <!-- Cataluña + Burgos accent -->
  <rect x="8" y="210" width="102" height="5" rx="2.5" fill="#FCDD09" opacity=".4"/>
  <rect x="110" y="210" width="102" height="5" rx="2.5" fill="#C60B1E" opacity=".4"/>
  <rect x="8" y="217" width="102" height="4" rx="2" fill="#DA121A" opacity=".3"/>
  <rect x="110" y="217" width="102" height="4" rx="2" fill="white" opacity=".25"/>
  <!-- Body - split design -->
  <clipPath id="t-body-l"><rect x="70" y="155" width="40" height="60"/></clipPath>
  <clipPath id="t-body-r"><rect x="110" y="155" width="40" height="60"/></clipPath>
  <path d="M70 175 Q70 160 85 155 L135 155 Q150 160 150 175 L150 205 Q150 215 110 215 Q70 215 70 205 Z" fill="url(#t-suit-l)" clip-path="url(#t-body-l)"/>
  <path d="M70 175 Q70 160 85 155 L135 155 Q150 160 150 175 L150 205 Q150 215 110 215 Q70 215 70 205 Z" fill="url(#t-suit-r)" clip-path="url(#t-body-r)"/>
  <path d="M110 155 L110 205" stroke="white" stroke-width="1.2" opacity=".3"/>
  <!-- Senyera stripe left, Burgos stripe right -->
  <rect x="70" y="165" width="35" height="4" rx="2" fill="#FCDD09" opacity=".7"/>
  <rect x="115" y="165" width="30" height="4" rx="2" fill="white" opacity=".5"/>
  <!-- Arms -->
  <ellipse cx="58" cy="175" rx="14" ry="10" fill="url(#t-suit-l)"/>
  <ellipse cx="162" cy="175" rx="14" ry="10" fill="url(#t-suit-r)"/>
  <!-- BIG head -->
  <ellipse cx="110" cy="90" rx="56" ry="54" fill="url(#t-helmet)"/>
  <!-- Helmet split: Cataluña / Burgos -->
  <clipPath id="t-h-l"><rect x="54" y="36" width="56" height="75"/></clipPath>
  <clipPath id="t-h-r"><rect x="110" y="36" width="56" height="75"/></clipPath>
  <ellipse cx="110" cy="66" rx="46" ry="22" fill="#FCDD09" clip-path="url(#t-h-l)" opacity=".8"/>
  <ellipse cx="110" cy="66" rx="46" ry="22" fill="white" clip-path="url(#t-h-r)" opacity=".65"/>
  <rect x="62" y="56" width="96" height="4" rx="2" fill="#C60B1E" opacity=".6"/>
  <!-- Helmet shine -->
  <ellipse cx="92" cy="56" rx="16" ry="7" fill="white" opacity=".12"/>
  <!-- Visor -->
  <path d="M62 82 Q62 70 110 68 Q158 70 158 82 L158 108 Q158 120 110 122 Q62 120 62 108 Z" fill="#0f172a" stroke="#1a1d26" stroke-width="1.5"/>
  <!-- Face - strong jaw, slight smirk -->
  <ellipse cx="110" cy="95" rx="38" ry="24" fill="url(#t-skin)"/>
  <!-- Cool eyes -->
  <ellipse cx="93" cy="89" rx="8" ry="9" fill="white"/>
  <ellipse cx="127" cy="89" rx="8" ry="9" fill="white"/>
  <ellipse cx="95" cy="90" rx="5" ry="6" fill="#2D1B0E"/>
  <ellipse cx="129" cy="90" rx="5" ry="6" fill="#2D1B0E"/>
  <circle cx="97" cy="87" r="2.5" fill="white"/>
  <circle cx="131" cy="87" r="2.5" fill="white"/>
  <!-- Confident eyebrows (slightly angled) -->
  <path d="M82 77 Q93 74 102 78" stroke="#2D1B0E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M118 78 Q127 74 138 77" stroke="#2D1B0E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="110" cy="98" rx="3.5" ry="2.5" fill="#C4956E" opacity=".7"/>
  <!-- Cool smirk -->
  <path d="M94 105 Q110 113 128 108" stroke="#5C3A20" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M98 106 Q110 112 124 108" fill="white" opacity=".7"/>
  <!-- Cheeks -->
  <circle cx="80" cy="102" r="7" fill="url(#t-cheek)"/>
  <circle cx="140" cy="100" r="7" fill="url(#t-cheek)"/>
  <!-- Name -->
  <text x="110" y="230" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FCDD09" text-anchor="middle" opacity=".9">Toni</text>
</svg>
