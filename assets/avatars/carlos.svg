<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <defs>
    <radialGradient id="cs" cx="50%" cy="38%" r="50%"><stop offset="0%" stop-color="#F5D0B0"/><stop offset="100%" stop-color="#D4A070"/></radialGradient>
    <linearGradient id="ch" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0055A4"/><stop offset="50%" stop-color="#fff"/><stop offset="100%" stop-color="#0055A4"/></linearGradient>
  </defs>
  <rect width="200" height="260" rx="22" fill="#000820"/>
  <!-- TINY body in racing suit -->
  <path d="M76 208 Q68 198 78 192 L122 192 Q132 198 124 208 L128 242 Q100 252 72 242Z" fill="#0055A4"/>
  <rect x="60" y="210" width="80" height="3" rx="1" fill="white" opacity=".3"/>
