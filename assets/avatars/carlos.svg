  <ellipse cx="132" cy="202" rx="12" ry="8" fill="#0055A4"/>
  <!-- Neck athletic -->
  <rect x="90" y="184" width="20" height="10" rx="4" fill="url(#cs)"/>
  <!-- HUGE HELMET -->
  <ellipse cx="100" cy="86" rx="74" ry="72" fill="url(#ch)"/>
  <ellipse cx="100" cy="56" rx="64" ry="38" fill="url(#ch)"/>
  <ellipse cx="76" cy="46" rx="24" ry="10" fill="white" opacity=".12"/>
  <!-- Visor -->
  <path d="M36 78 Q36 66 100 63 Q164 66 164 78 L164 128 Q164 155 100 160 Q36 155 36 128Z" fill="#0a1520"/>
  <!-- Face -->
  <ellipse cx="100" cy="116" rx="52" ry="40" fill="url(#cs)"/>
