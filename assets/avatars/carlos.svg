<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240">
  <defs>
    <linearGradient id="c-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#081020"/><stop offset="100%" stop-color="#0a0a14"/></linearGradient>
    <linearGradient id="c-helmet" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="white"/><stop offset="40%" stop-color="#005DA6"/><stop offset="100%" stop-color="#003B6B"/></linearGradient>
    <linearGradient id="c-suit" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#005DA6"/><stop offset="50%" stop-color="white"/><stop offset="100%" stop-color="#005DA6"/></linearGradient>
    <radialGradient id="c-skin" cx="50%" cy="40%" r="55%"><stop offset="0%" stop-color="#FDDCB5"/><stop offset="100%" stop-color="#E8B896"/></radialGradient>
    <radialGradient id="c-cheek" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFAAAA" stop-opacity=".5"/><stop offset="100%" stop-color="#FFAAAA" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="220" height="240" rx="24" fill="url(#c-bg)"/>
  <rect x="8" y="8" width="204" height="224" rx="22" fill="none" stroke="#005DA6" stroke-width="1" opacity=".25"/>
  <!-- San Sebastián accent (blue + white) -->
  <rect x="8" y="210" width="204" height="5" rx="2.5" fill="#005DA6" opacity=".4"/>
  <rect x="8" y="217" width="204" height="4" rx="2" fill="white" opacity=".25"/>
  <!-- Body -->
  <path d="M70 175 Q70 160 85 155 L135 155 Q150 160 150 175 L150 205 Q150 215 110 215 Q70 215 70 205 Z" fill="url(#c-suit)"/>
  <rect x="70" y="163" width="70" height="5" rx="2.5" fill="#005DA6" opacity=".6"/>
  <rect x="70" y="170" width="70" height="3" rx="1.5" fill="white" opacity=".5"/>
  <rect x="70" y="175" width="70" height="5" rx="2.5" fill="#005DA6" opacity=".6"/>
  <path d="M110 155 L110 205" stroke="#003B6B" stroke-width=".8" opacity=".3"/>
  <!-- Arms -->
  <ellipse cx="58" cy="175" rx="14" ry="10" fill="#005DA6"/>
  <ellipse cx="162" cy="175" rx="14" ry="10" fill="#005DA6"/>
  <!-- BIG head -->
  <ellipse cx="110" cy="90" rx="56" ry="54" fill="url(#c-helmet)"/>
  <!-- White top with blue wave (Donostia style) -->
  <ellipse cx="110" cy="65" rx="46" ry="22" fill="white" opacity=".85"/>
  <path d="M66 68 Q78 60 90 68 Q102 76 114 68 Q126 60 138 68 Q150 76 154 68" fill="none" stroke="#005DA6" stroke-width="3" opacity=".5"/>
  <!-- Helmet shine -->
  <ellipse cx="88" cy="56" rx="16" ry="7" fill="white" opacity=".2"/>
  <!-- Visor -->
  <path d="M62 82 Q62 70 110 68 Q158 70 158 82 L158 108 Q158 120 110 122 Q62 120 62 108 Z" fill="#0f172a" stroke="#1a1d26" stroke-width="1.5"/>
  <!-- Face - wider, fun -->
  <ellipse cx="110" cy="95" rx="38" ry="24" fill="url(#c-skin)"/>
  <!-- Curly hair peeking from helmet sides -->
  <path d="M62 88 Q56 82 58 76 Q60 70 64 74 Q62 80 64 85" fill="#5C3A20" opacity=".6"/>
  <path d="M65 92 Q58 88 60 82 Q62 76 66 80 Q64 86 66 90" fill="#5C3A20" opacity=".5"/>
  <path d="M158 88 Q164 82 162 76 Q160 70 156 74 Q158 80 156 85" fill="#5C3A20" opacity=".6"/>
  <path d="M155 92 Q162 88 160 82 Q158 76 154 80 Q156 86 154 90" fill="#5C3A20" opacity=".5"/>
  <!-- Big happy eyes -->
  <ellipse cx="92" cy="89" rx="9" ry="10" fill="white"/>
  <ellipse cx="128" cy="89" rx="9" ry="10" fill="white"/>
  <ellipse cx="94" cy="90" rx="5.5" ry="6.5" fill="#2D1B0E"/>
  <ellipse cx="130" cy="90" rx="5.5" ry="6.5" fill="#2D1B0E"/>
  <circle cx="96" cy="87" r="2.5" fill="white"/>
  <circle cx="132" cy="87" r="2.5" fill="white"/>
  <!-- Happy eyebrows -->
  <path d="M80 77 Q92 72 102 77" stroke="#4A3020" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M118 77 Q128 72 140 77" stroke="#4A3020" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="110" cy="98" rx="4" ry="3" fill="#D4A574" opacity=".6"/>
  <!-- Big laughing mouth -->
  <path d="M88 104 Q110 124 132 104" stroke="#5C3A20" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M92 106 Q110 120 128 106" fill="white" opacity=".9"/>
  <path d="M96 112 Q110 118 124 112" fill="#E88" opacity=".35"/>
  <!-- Cheeks -->
  <circle cx="78" cy="102" r="9" fill="url(#c-cheek)"/>
  <circle cx="142" cy="102" r="9" fill="url(#c-cheek)"/>
  <!-- Name -->
  <text x="110" y="230" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#7DBCE8" text-anchor="middle" opacity=".9">Carlos</text>
</svg>
