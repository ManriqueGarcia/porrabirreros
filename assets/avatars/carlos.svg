  <ellipse cx="74" cy="108" rx="12" ry="12" fill="white"/>
  <ellipse cx="126" cy="108" rx="12" ry="12" fill="white"/>
  <ellipse cx="76" cy="109" rx="7" ry="8" fill="#2D6B3A"/>
  <ellipse cx="128" cy="109" rx="7" ry="8" fill="#2D6B3A"/>
  <circle cx="79" cy="106" r="3" fill="white"/>
  <circle cx="131" cy="106" r="3" fill="white"/>
  <!-- Thick dark eyebrows (intense look) -->
  <path d="M58 94 Q74 84 90 94" stroke="#1a0f05" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M110 94 Q126 84 142 94" stroke="#1a0f05" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Short dark hair from helmet -->
  <path d="M40 82 Q38 76 42 72" stroke="#2D1B0E" stroke-width="3" fill="none"/>
  <path d="M160 82 Q162 76 158 72" stroke="#2D1B0E" stroke-width="3" fill="none"/>
  <!-- Nose -->
  <path d="M95 118 Q100 132 105 118" stroke="#B88050" stroke-width="2" fill="none"/>
  <ellipse cx="100" cy="130" rx="6" ry="3" fill="#C49060" opacity=".5"/>
  <!-- Competitive fierce grin -->
  <path d="M74 144 Q100 160 126 144" stroke="#5C3A20" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M80 146 Q100 157 120 146" fill="white" opacity=".8"/>
  <!-- Cheeks -->
  <circle cx="54" cy="130" r="10" fill="#E88080" opacity=".18"/>
  <circle cx="146" cy="130" r="10" fill="#E88080" opacity=".18"/>
  <!-- Square jaw (deportista) -->
  <path d="M58 148 Q100 168 142 148" stroke="#C49060" stroke-width="1" fill="none" opacity=".25"/>
  <!-- RS on helmet -->
  <rect x="82" y="38" width="36" height="16" rx="4" fill="white" opacity=".6"/>
  <text x="100" y="50" font-family="system-ui" font-size="10" font-weight="900" fill="#0055A4" text-anchor="middle">RS</text>
  <text x="100" y="256" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#5a9abf" text-anchor="middle" opacity=".9">Carlos</text>
</svg>
