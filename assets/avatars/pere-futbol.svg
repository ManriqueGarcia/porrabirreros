<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240">
  <defs>
    <linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2a1a08"/><stop offset="100%" stop-color="#0a0a12"/></linearGradient>
    <linearGradient id="pf-jersey" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#A50044"/><stop offset="50%" stop-color="#A50044"/><stop offset="50%" stop-color="#004D98"/><stop offset="100%" stop-color="#004D98"/></linearGradient>
    <linearGradient id="pf-shorts" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#004D98"/><stop offset="100%" stop-color="#003570"/></linearGradient>
    <radialGradient id="pf-skin" cx="50%" cy="40%" r="55%"><stop offset="0%" stop-color="#FDDCB5"/><stop offset="100%" stop-color="#E8B896"/></radialGradient>
    <radialGradient id="pf-cheek" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#F5A0A0" stop-opacity=".5"/><stop offset="100%" stop-color="#F5A0A0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="220" height="240" rx="24" fill="url(#pf-bg)"/>
  <rect x="8" y="8" width="204" height="224" rx="22" fill="none" stroke="#FCDD09" stroke-width="1" opacity=".2"/>
  <!-- Senyera accent -->
  <rect x="8" y="210" width="204" height="6" rx="3" fill="#DA121A" opacity=".4"/>
  <rect x="8" y="218" width="204" height="4" rx="2" fill="#FCDD09" opacity=".3"/>
  <!-- Shorts -->
  <rect x="78" y="192" width="26" height="20" rx="6" fill="url(#pf-shorts)"/>
  <rect x="116" y="192" width="26" height="20" rx="6" fill="url(#pf-shorts)"/>
  <!-- Body - Barça jersey -->
  <path d="M70 160 Q70 148 85 143 L135 143 Q150 148 150 160 L150 195 Q150 200 110 200 Q70 200 70 195 Z" fill="url(#pf-jersey)"/>
  <!-- Collar -->
  <path d="M95 143 Q110 150 125 143" stroke="#FCDD09" stroke-width="2.5" fill="none"/>
  <!-- Senyera stripes on sleeve -->
  <rect x="70" y="155" width="12" height="3" rx="1" fill="#FCDD09" opacity=".7"/>
  <rect x="70" y="160" width="12" height="3" rx="1" fill="#DA121A" opacity=".7"/>
  <rect x="138" y="155" width="12" height="3" rx="1" fill="#FCDD09" opacity=".7"/>
  <rect x="138" y="160" width="12" height="3" rx="1" fill="#DA121A" opacity=".7"/>
  <!-- Number -->
  <text x="110" y="185" font-family="system-ui,sans-serif" font-size="14" font-weight="900" fill="#FCDD09" text-anchor="middle" opacity=".7">8</text>
  <!-- Arms -->
  <ellipse cx="58" cy="165" rx="14" ry="10" fill="#A50044"/>
  <ellipse cx="162" cy="165" rx="14" ry="10" fill="#004D98"/>
  <!-- BIG head -->
  <ellipse cx="110" cy="80" rx="50" ry="48" fill="url(#pf-skin)"/>
  <!-- Hair - short, neat -->
  <ellipse cx="110" cy="50" rx="46" ry="24" fill="#2D1B0E"/>
  <path d="M64 70 Q64 38 110 30 Q156 38 156 70" fill="#2D1B0E"/>
  <path d="M68 76 Q66 64 72 56" fill="#2D1B0E"/>
  <path d="M152 76 Q154 64 148 56" fill="#2D1B0E"/>
  <!-- Hair shine -->
  <ellipse cx="98" cy="44" rx="16" ry="7" fill="white" opacity=".08"/>
  <!-- Big cartoon eyes -->
  <ellipse cx="93" cy="79" rx="9" ry="10" fill="white"/>
  <ellipse cx="127" cy="79" rx="9" ry="10" fill="white"/>
  <ellipse cx="95" cy="80" rx="5" ry="6" fill="#3B2510"/>
  <ellipse cx="129" cy="80" rx="5" ry="6" fill="#3B2510"/>
  <circle cx="97" cy="77" r="2.5" fill="white"/>
  <circle cx="131" cy="77" r="2.5" fill="white"/>
  <!-- Eyebrows -->
  <path d="M82 67 Q93 63 102 67" stroke="#3B2510" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M118 67 Q127 63 138 67" stroke="#3B2510" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="110" cy="88" rx="3.5" ry="2.5" fill="#D4A574" opacity=".7"/>
  <!-- Big warm smile -->
  <path d="M92 95 Q110 108 128 95" stroke="#5C3A20" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M96 96 Q110 104 124 96" fill="white" opacity=".8"/>
  <!-- Cheeks -->
  <circle cx="82" cy="92" r="8" fill="url(#pf-cheek)"/>
  <circle cx="138" cy="92" r="8" fill="url(#pf-cheek)"/>
  <!-- Football at feet -->
  <circle cx="85" cy="216" r="10" fill="white" stroke="#333" stroke-width="1"/>
  <path d="M80 211 L85 216 L90 211 M78 216 L85 222 L92 216" fill="none" stroke="#333" stroke-width=".8" opacity=".5"/>
  <!-- Name -->
  <text x="110" y="230" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FCDD09" text-anchor="middle" opacity=".9">Pere</text>
</svg>
