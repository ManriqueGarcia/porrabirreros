  <path d="M164 88 Q166 80 163 74" stroke="#F0ECE8" stroke-width="3" fill="none" opacity=".5"/>
  <!-- Big warm friendly eyes -->
  <ellipse cx="72" cy="108" rx="14" ry="13" fill="white"/>
  <ellipse cx="128" cy="108" rx="14" ry="13" fill="white"/>
  <ellipse cx="74" cy="109" rx="8" ry="9" fill="#4A7030"/>
  <ellipse cx="130" cy="109" rx="8" ry="9" fill="#4A7030"/>
  <circle cx="77" cy="106" r="3.5" fill="white"/>
  <circle cx="133" cy="106" r="3.5" fill="white"/>
