<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2a1a08"/><stop offset="100%" stop-color="#0a0a12"/></linearGradient>
    <linearGradient id="p-helmet" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#FCDD09"/><stop offset="50%" stop-color="#DA121A"/><stop offset="100%" stop-color="#A00E14"/></linearGradient>
    <linearGradient id="p-suit" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#DA121A"/><stop offset="100%" stop-color="#8B0E12"/></linearGradient>
    <radialGradient id="p-skin" cx="50%" cy="40%" r="55%"><stop offset="0%" stop-color="#FDDCB5"/><stop offset="100%" stop-color="#E8B896"/></radialGradient>
    <radialGradient id="p-cheek" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#F5A0A0" stop-opacity=".5"/><stop offset="100%" stop-color="#F5A0A0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="220" height="240" rx="24" fill="url(#p-bg)"/>
  <rect x="8" y="8" width="204" height="224" rx="22" fill="none" stroke="#FCDD09" stroke-width="1" opacity=".2"/>
  <!-- Senyera stripe accent -->
  <rect x="8" y="210" width="204" height="6" rx="3" fill="#DA121A" opacity=".4"/>
  <rect x="8" y="218" width="204" height="4" rx="2" fill="#FCDD09" opacity=".3"/>
  <!-- Body - chibi small -->
  <path d="M70 175 Q70 160 85 155 L135 155 Q150 160 150 175 L150 205 Q150 215 110 215 Q70 215 70 205 Z" fill="url(#p-suit)"/>
  <rect x="70" y="162" width="70" height="5" rx="2.5" fill="#FCDD09" opacity=".8"/>
  <rect x="70" y="170" width="70" height="3" rx="1.5" fill="#DA121A" opacity=".6"/>
  <rect x="70" y="176" width="70" height="5" rx="2.5" fill="#FCDD09" opacity=".8"/>
  <path d="M110 155 L110 205" stroke="#A00E14" stroke-width=".8" opacity=".4"/>
  <!-- Arms -->
  <ellipse cx="58" cy="175" rx="14" ry="10" fill="url(#p-suit)"/>
  <ellipse cx="162" cy="175" rx="14" ry="10" fill="url(#p-suit)"/>
  <!-- BIG head - cartoon proportions -->
  <ellipse cx="110" cy="90" rx="56" ry="54" fill="url(#p-helmet)"/>
  <!-- Senyera stripes on helmet -->
  <ellipse cx="110" cy="68" rx="48" ry="22" fill="#FCDD09" opacity=".85"/>
  <rect x="62" y="58" width="96" height="5" rx="2" fill="#DA121A" opacity=".7"/>
  <rect x="65" y="50" width="90" height="4" rx="2" fill="#DA121A" opacity=".5"/>
  <!-- Helmet shine -->
  <ellipse cx="90" cy="56" rx="18" ry="8" fill="white" opacity=".15"/>
  <!-- Visor opening -->
  <path d="M62 82 Q62 70 110 68 Q158 70 158 82 L158 108 Q158 120 110 122 Q62 120 62 108 Z" fill="#0f172a" stroke="#1a1d26" stroke-width="1.5"/>
  <!-- Face inside visor -->
  <ellipse cx="110" cy="95" rx="38" ry="24" fill="url(#p-skin)"/>
  <!-- Big cartoon eyes -->
  <ellipse cx="93" cy="90" rx="9" ry="10" fill="white"/>
  <ellipse cx="127" cy="90" rx="9" ry="10" fill="white"/>
  <ellipse cx="95" cy="91" rx="5" ry="6" fill="#3B2510"/>
  <ellipse cx="129" cy="91" rx="5" ry="6" fill="#3B2510"/>
  <circle cx="97" cy="88" r="2.5" fill="white"/>
  <circle cx="131" cy="88" r="2.5" fill="white"/>
  <!-- Eyebrows -->
  <path d="M82 78 Q93 74 102 78" stroke="#3B2510" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M118 78 Q127 74 138 78" stroke="#3B2510" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="110" cy="98" rx="3.5" ry="2.5" fill="#D4A574" opacity=".7"/>
  <!-- Big warm smile -->
  <path d="M92 105 Q110 118 128 105" stroke="#5C3A20" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M96 106 Q110 114 124 106" fill="white" opacity=".8"/>
  <!-- Cheeks -->
  <circle cx="82" cy="102" r="8" fill="url(#p-cheek)"/>
  <circle cx="138" cy="102" r="8" fill="url(#p-cheek)"/>
  <!-- Name -->
  <text x="110" y="230" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FCDD09" text-anchor="middle" opacity=".9">Pere</text>
</svg>
