<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <defs>
    <radialGradient id="ps" cx="50%" cy="38%" r="50%"><stop offset="0%" stop-color="#FFE0C0"/><stop offset="100%" stop-color="#D8A878"/></radialGradient>
    <linearGradient id="ph" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#004D98"/><stop offset="50%" stop-color="#A50044"/><stop offset="100%" stop-color="#004D98"/></linearGradient>
  </defs>
  <rect width="200" height="260" rx="22" fill="#08001a"/>
  <!-- TINY strong body in suit -->
  <path d="M72 210 Q62 198 74 190 L126 190 Q138 198 128 210 L134 242 Q100 254 66 242Z" fill="#004D98"/>
