  <path d="M173 112 L178 100" stroke="#FDE68A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M173 112 L168 98" stroke="#FDE68A" stroke-width="4" fill="none" stroke-linecap="round"/>
