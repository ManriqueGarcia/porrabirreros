    <linearGradient id="pere-suit" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#EF4444"/><stop offset="100%" style="stop-color:#D90429"/></linearGradient>
    <linearGradient id="pere-helmet" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#F87171"/><stop offset="100%" style="stop-color:#DC2626"/></linearGradient>
