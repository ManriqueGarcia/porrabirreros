  <path d="M58 142 Q64 148 66 148" stroke="#C49060" stroke-width="1.2" fill="none" opacity=".4"/>
  <path d="M142 142 Q136 148 134 148" stroke="#C49060" stroke-width="1.2" fill="none" opacity=".4"/>
  <!-- Rosy cheeks -->
  <circle cx="52" cy="130" r="12" fill="#E88080" opacity=".18"/>
  <circle cx="148" cy="130" r="12" fill="#E88080" opacity=".18"/>
  <!-- NBA basketball near body -->
  <circle cx="148" cy="230" r="8" fill="#FF6B00" opacity=".4"/>
  <path d="M143 230 Q148 225 153 230 Q148 235 143 230" stroke="white" stroke-width=".8" fill="none" opacity=".4"/>
  <text x="100" y="256" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#5fb8a8" text-anchor="middle" opacity=".9">Pere</text>
