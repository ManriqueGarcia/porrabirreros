  <path d="M54 92 Q72 82 90 92" stroke="#C0B8B0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M110 92 Q128 82 146 92" stroke="#C0B8B0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Generous nose -->
