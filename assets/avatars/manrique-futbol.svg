<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240">
  <defs>
    <linearGradient id="mf-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#081828"/><stop offset="100%" stop-color="#0a0a14"/></linearGradient>
    <linearGradient id="mf-jersey" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#E10600"/><stop offset="48%" stop-color="#E10600"/><stop offset="48%" stop-color="#FFFFFF"/><stop offset="52%" stop-color="#FFFFFF"/><stop offset="52%" stop-color="#E10600"/><stop offset="100%" stop-color="#E10600"/></linearGradient>
    <linearGradient id="mf-shorts" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#0055A4"/><stop offset="100%" stop-color="#003060"/></linearGradient>
    <radialGradient id="mf-skin" cx="50%" cy="40%" r="55%"><stop offset="0%" stop-color="#FDDCB5"/><stop offset="100%" stop-color="#E8B896"/></radialGradient>
    <radialGradient id="mf-cheek" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFAAAA" stop-opacity=".5"/><stop offset="100%" stop-color="#FFAAAA" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="220" height="240" rx="24" fill="url(#mf-bg)"/>
  <rect x="8" y="8" width="204" height="224" rx="22" fill="none" stroke="#0055A4" stroke-width="1" opacity=".25"/>
  <!-- Asturias accent -->
  <rect x="8" y="210" width="204" height="5" rx="2.5" fill="#0055A4" opacity=".4"/>
  <rect x="8" y="217" width="204" height="4" rx="2" fill="#FFD700" opacity=".3"/>
  <!-- Shorts -->
  <rect x="78" y="192" width="26" height="20" rx="6" fill="url(#mf-shorts)"/>
  <rect x="116" y="192" width="26" height="20" rx="6" fill="url(#mf-shorts)"/>
  <!-- Body - football jersey -->
  <path d="M70 160 Q70 148 85 143 L135 143 Q150 148 150 160 L150 195 Q150 200 110 200 Q70 200 70 195 Z" fill="url(#mf-jersey)"/>
  <!-- Collar -->
  <path d="M95 143 Q110 150 125 143" stroke="#0055A4" stroke-width="2.5" fill="none"/>
  <!-- Cruz de la Victoria on jersey -->
  <line x1="104" y1="168" x2="116" y2="168" stroke="#FFD700" stroke-width="2.5" opacity=".7"/>
  <line x1="110" y1="162" x2="110" y2="174" stroke="#FFD700" stroke-width="2.5" opacity=".7"/>
  <!-- Number -->
  <text x="110" y="190" font-family="system-ui,sans-serif" font-size="14" font-weight="900" fill="#0055A4" text-anchor="middle" opacity=".6">10</text>
  <!-- Arms -->
  <ellipse cx="58" cy="165" rx="14" ry="10" fill="#E10600"/>
  <!-- Waving arm -->
  <path d="M152 155 Q168 132 175 125 Q178 122 180 126 Q177 135 162 152" fill="#E10600" stroke="#C00" stroke-width="1"/>
  <circle cx="178" cy="123" r="8" fill="url(#mf-skin)"/>
  <path d="M172 118 L175 112 M176 117 L178 111 M180 118 L182 113" stroke="url(#mf-skin)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- BIG head -->
  <ellipse cx="110" cy="80" rx="50" ry="48" fill="url(#mf-skin)"/>
  <!-- Hair -->
  <ellipse cx="110" cy="52" rx="46" ry="24" fill="#3B2510"/>
  <path d="M64 72 Q64 40 110 32 Q156 40 156 72" fill="#3B2510"/>
  <path d="M68 78 Q66 65 72 58" fill="#3B2510"/>
  <path d="M152 78 Q154 65 148 58" fill="#3B2510"/>
  <!-- Hair shine -->
  <ellipse cx="95" cy="46" rx="18" ry="8" fill="white" opacity=".08"/>
  <!-- Big expressive eyes -->
  <ellipse cx="92" cy="78" rx="10" ry="11" fill="white"/>
  <ellipse cx="128" cy="78" rx="10" ry="11" fill="white"/>
  <ellipse cx="94" cy="79" rx="6" ry="7" fill="#3B2510"/>
  <ellipse cx="130" cy="79" rx="6" ry="7" fill="#3B2510"/>
  <circle cx="96" cy="76" r="3" fill="white"/>
  <circle cx="132" cy="76" r="3" fill="white"/>
  <!-- Excited eyebrows -->
  <path d="M80 65 Q92 59 102 65" stroke="#3B2510" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M118 65 Q128 59 140 65" stroke="#3B2510" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="110" cy="88" rx="4" ry="3" fill="#D4A574" opacity=".6"/>
  <!-- BIG excited grin -->
  <path d="M88 94 Q110 112 132 94" stroke="#5C3A20" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M92 96 Q110 108 128 96" fill="white" opacity=".9"/>
  <path d="M96 102 Q110 106 124 102" fill="#E88" opacity=".3"/>
  <!-- Cheeks -->
  <circle cx="78" cy="92" r="9" fill="url(#mf-cheek)"/>
  <circle cx="142" cy="92" r="9" fill="url(#mf-cheek)"/>
  <!-- Football at feet -->
  <circle cx="135" cy="216" r="10" fill="white" stroke="#333" stroke-width="1"/>
  <path d="M130 211 L135 216 L140 211 M128 216 L135 222 L142 216" fill="none" stroke="#333" stroke-width=".8" opacity=".5"/>
  <!-- Name -->
  <text x="110" y="230" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFD700" text-anchor="middle" opacity=".9">Manrique</text>
</svg>
