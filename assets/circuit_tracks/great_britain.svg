<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <defs>
    <filter id="glow-gb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="120" fill="rgba(0,0,0,0.4)"/>
  <g filter="url(#glow-gb)">
    <!-- Silverstone: Maggots, Becketts, Hangar straight, Copse, Stowe - D-shaped -->
    <path d="M 35 60
             L 35 35
             Q 35 15 60 15
             L 140 15
             Q 165 15 165 35
             L 165 55
             Q 165 75 150 90
             L 100 110
             Q 50 95 35 75
             L 35 60
             Z" fill="none" stroke="#E10600" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="35" y1="58" x2="35" y2="62" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
