<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <defs>
    <filter id="glow-austria" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="120" fill="rgba(0,0,0,0.4)"/>
  <g filter="url(#glow-austria)">
    <!-- Red Bull Ring: 3 straights connected by tight turns, steep elevation -->
    <path d="M 100 108
             L 100 25
             L 172 25
             Q 192 25 192 50
             L 192 75
             Q 192 95 168 95
             L 100 95
             Z" fill="none" stroke="#E10600" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="100" y1="106" x2="100" y2="110" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
