<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <defs>
    <filter id="glow-hungary" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="120" fill="rgba(0,0,0,0.4)"/>
  <g filter="url(#glow-hungary)">
    <!-- Tight twisty horseshoe-shaped circuit -->
    <path d="M 100 110
             L 100 85
             Q 100 70 115 65
             L 165 55
             Q 185 50 185 35
             L 185 25
             Q 185 15 170 15
             L 30 15
             Q 15 15 15 35
             L 15 55
             Q 15 70 35 75
             L 85 85
             Q 100 90 100 110
             Z" fill="none" stroke="#E10600" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="100" y1="108" x2="100" y2="112" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
