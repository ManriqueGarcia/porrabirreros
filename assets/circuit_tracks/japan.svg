             L 190 55
             Q 190 60 185 60
             L 115 60
             Q 100 60 100 45
             L 100 75
             Q 100 110 85 110
             L 25 110
             Q 10 110 10 85
             L 10 65
             Q 10 60 15 60
             L 85 60
             Q 100 60 100 75
             Z" fill="none" stroke="#E10600" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="98" y1="58" x2="102" y2="62" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
