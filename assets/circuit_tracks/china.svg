             Q 25 35 45 28
             Q 65 22 85 25
             Q 105 28 120 35
             L 155 25
             L 175 40
             Q 188 55 175 68
             L 145 95
             L 55 95
             Q 25 95 25 68
             Q 25 55 35 48
             L 25 60" fill="none" stroke="#E10600" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="25" y1="58" x2="25" y2="62" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
