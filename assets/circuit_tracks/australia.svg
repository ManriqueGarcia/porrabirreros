<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <defs>
    <filter id="glow-australia" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="120" fill="rgba(0,0,0,0.4)"/>
  <g filter="url(#glow-australia)">
    <!-- Albert Park: street circuit around lake, clockwise, multiple chicanes -->
    <path d="M 100 95
             Q 75 95 60 85
             L 35 70
             Q 20 55 25 35
             L 35 25
             Q 50 15 75 18
             L 125 18
             Q 150 20 165 35
             L 175 55
             Q 180 75 165 90
             L 140 95
             Q 120 100 100 95
             Z" fill="none" stroke="#E10600" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="100" y1="93" x2="100" y2="97" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
