<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <defs>
    <filter id="glow-barcelona" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="120" fill="rgba(0,0,0,0.4)"/>
  <g filter="url(#glow-barcelona)">
    <!-- Flowing layout: long straight, chicane, sweeping turns -->
    <path d="M 30 60
             L 30 35
             Q 30 15 55 15
             L 145 15
             Q 170 15 170 40
             L 170 55
             Q 170 75 150 90
             L 100 110
             Q 70 120 45 100
             L 25 75
             Q 15 60 25 45
             L 30 60" fill="none" stroke="#E10600" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="30" y1="58" x2="30" y2="62" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
