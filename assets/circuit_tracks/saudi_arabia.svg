<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <defs>
    <filter id="glow-saudi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="120" fill="rgba(0,0,0,0.4)"/>
  <g filter="url(#glow-saudi)">
    <!-- Long fast street circuit, many sweeping corners, follows coast - elongated shape -->
    <path d="M 15 60
             Q 15 25 45 20
             L 80 18
             Q 110 15 135 25
             L 165 40
             Q 185 55 175 75
             L 150 95
             Q 130 110 100 108
             L 60 105
             Q 30 100 20 80
             L 15 60" fill="none" stroke="#E10600" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="15" y1="58" x2="15" y2="62" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
