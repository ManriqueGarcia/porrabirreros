<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <defs>
    <filter id="glow-netherlands" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="120" fill="rgba(0,0,0,0.4)"/>
  <g filter="url(#glow-netherlands)">
    <!-- Zandvoort: seaside, banked corners, flowing medium-speed turns -->
    <path d="M 50 95
             L 50 70
             Q 50 50 70 45
             L 130 40
             Q 155 38 170 55
             L 180 75
             Q 185 95 165 105
             L 100 112
             Q 70 115 50 95
             Z" fill="none" stroke="#E10600" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="50" y1="93" x2="50" y2="97" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
