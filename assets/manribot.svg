<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mb-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c0c8d8"/>
      <stop offset="100%" stop-color="#8090a8"/>
    </linearGradient>
    <linearGradient id="mb-dome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8ecf2"/>
      <stop offset="100%" stop-color="#b0b8c8"/>
    </linearGradient>
    <radialGradient id="mb-eye" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </radialGradient>
    <linearGradient id="mb-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E10600"/>
      <stop offset="100%" stop-color="#ff3030"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="32" cy="60" rx="18" ry="3" fill="#000" opacity=".15"/>
  <!-- Legs -->
  <rect x="14" y="48" width="6" height="10" rx="2" fill="#607080"/>
  <rect x="44" y="48" width="6" height="10" rx="2" fill="#607080"/>
  <!-- Feet -->
  <rect x="12" y="55" width="10" height="4" rx="2" fill="#505868"/>
  <rect x="42" y="55" width="10" height="4" rx="2" fill="#505868"/>
  <!-- Center leg -->
  <rect x="29" y="50" width="6" height="8" rx="2" fill="#607080"/>
  <rect x="27" y="55" width="10" height="4" rx="2" fill="#505868"/>
  <!-- Body -->
  <rect x="16" y="26" width="32" height="24" rx="4" fill="url(#mb-body)" stroke="#8898a8" stroke-width=".5"/>
  <!-- F1 red stripe on body -->
  <rect x="16" y="30" width="32" height="3" fill="url(#mb-accent)" opacity=".9"/>
  <rect x="16" y="38" width="32" height="2" fill="url(#mb-accent)" opacity=".5"/>
  <!-- Body details -->
  <rect x="20" y="35" width="4" height="6" rx="1" fill="#4a5568" opacity=".6"/>
  <rect x="26" y="35" width="4" height="6" rx="1" fill="#4a5568" opacity=".6"/>
  <rect x="34" y="35" width="4" height="6" rx="1" fill="#2d6ee6" opacity=".5"/>
  <rect x="40" y="35" width="4" height="6" rx="1" fill="#2d6ee6" opacity=".5"/>
  <!-- Vent lines -->
  <line x1="20" y1="44" x2="44" y2="44" stroke="#6878888" stroke-width=".5" opacity=".5"/>
  <line x1="20" y1="46" x2="44" y2="46" stroke="#6878888" stroke-width=".5" opacity=".5"/>
  <!-- Dome -->
  <path d="M18 26 Q18 10 32 8 Q46 10 46 26 Z" fill="url(#mb-dome)" stroke="#a0a8b8" stroke-width=".5"/>
  <!-- Eye (main sensor) -->
  <circle cx="32" cy="18" r="5" fill="url(#mb-eye)" stroke="#990000" stroke-width=".8"/>
  <circle cx="31" cy="16.5" r="1.5" fill="#ff8888" opacity=".7"/>
  <!-- Small sensor -->
  <circle cx="24" cy="22" r="2" fill="#2d6ee6" stroke="#1a4faa" stroke-width=".5"/>
  <circle cx="23.5" cy="21.5" r=".7" fill="#6fadff" opacity=".6"/>
  <!-- Dome panel lines -->
  <path d="M22 22 Q22 14 32 12" fill="none" stroke="#9aa4b4" stroke-width=".4" opacity=".5"/>
  <path d="M42 22 Q42 14 32 12" fill="none" stroke="#9aa4b4" stroke-width=".4" opacity=".5"/>
  <!-- Racing flag detail on dome -->
  <rect x="36" y="14" width="2" height="2" fill="#222" opacity=".3"/>
  <rect x="38" y="14" width="2" height="2" fill="#fff" opacity=".3"/>
  <rect x="36" y="16" width="2" height="2" fill="#fff" opacity=".3"/>
  <rect x="38" y="16" width="2" height="2" fill="#222" opacity=".3"/>
  <!-- Antenna -->
  <line x1="32" y1="8" x2="32" y2="3" stroke="#a0a8b8" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="32" cy="2.5" r="1.5" fill="#E10600"/>
</svg>
