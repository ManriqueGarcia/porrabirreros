<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bgRadialF1" cx="50%" cy="50%" r="95%">
      <stop offset="0%" stop-color="#0c0c10"/>
      <stop offset="30%" stop-color="#08080c"/>
      <stop offset="60%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="accentRedF1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E10600"/>
      <stop offset="50%" stop-color="#FF2D20"/>
      <stop offset="100%" stop-color="#9C0000"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E10600" stop-opacity="0"/>
      <stop offset="15%" stop-color="#E10600" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E10600" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="50%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <filter id="glowF1">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bgRadialF1)"/>
  <!-- Lneas de pista sutiles -->
  <g stroke="#E10600" stroke-width="0.5" fill="none" opacity="0.08">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
  </g>
  <!-- Estela principal - lineas de velocidad detras del coche -->
  <g filter="url(#glowF1)">
    <path d="M80,540 L1380,540" stroke="url(#trailGrad)" stroke-width="160" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M150,540 L1350,540" stroke="#E10600" stroke-width="100" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M200,536 L1320,536" stroke="#E10600" stroke-width="5" fill="none" opacity="0.25"/>
    <path d="M250,540 L1300,540" stroke="#E10600" stroke-width="8" fill="none" opacity="0.3"/>
    <path d="M300,544 L1280,544" stroke="#E10600" stroke-width="5" fill="none" opacity="0.25"/>
    <path d="M220,528 L1310,528" stroke="#E10600" stroke-width="1" fill="none" opacity="0.2"/>
    <path d="M260,552 L1290,552" stroke="#E10600" stroke-width="1" fill="none" opacity="0.2"/>
  </g>
  <!-- Coche F1 silueta principal -->
  <g transform="translate(1260,540) scale(3.2)" filter="url(#softGlow)">
    <path d="M-78,-10 L-56,-14 L-34,-16 L-12,-16 L10,-14 L28,-10 L38,-6 L48,-2 L58,0 L68,0 L78,-2 L86,-6 L92,-10 L96,-12 L98,-10 L96,-6 L86,-2 L76,2 L66,4 L56,6 L46,6 L36,4 L26,0 L16,-4 L6,-8 L-12,-8 L-34,-10 L-56,-12 L-78,-10 Z" fill="url(#carGrad)" stroke="#E10600" stroke-width="2" opacity="0.95"/>
    <ellipse cx="-54" cy="6" rx="10" ry="5" fill="#0a0a0a" stroke="#444"/>
    <ellipse cx="70" cy="6" rx="10" ry="5" fill="#0a0a0a" stroke="#444"/>
    <rect x="-3" y="-3" width="20" height="6" rx="1" fill="#E10600" opacity="0.9"/>
    <path d="M-22,-4 L-8,-2" stroke="#E10600" stroke-width="1.5" opacity="0.7"/>
  </g>
  <!-- Segunda estela - coche ms atrs -->
  <g transform="translate(0,0)" opacity="0.5">
    <path d="M-60,420 L500,420" stroke="#E10600" stroke-width="80" fill="none" stroke-linecap="round" opacity="0.3"/>
    <path d="M20,418 L480,418" stroke="#E10600" stroke-width="3" fill="none" opacity="0.18"/>
    <g transform="translate(360,420) scale(2)">
      <path d="M-78,-10 L-56,-14 L-34,-16 L-12,-16 L10,-14 L28,-10 L38,-6 L48,-2 L58,0 L68,0 L78,-2 L86,-6 L92,-10 L96,-12 L98,-10 L96,-6 L86,-2 L76,2 L66,4 L56,6 L46,6 L36,4 L26,0 L16,-4 L6,-8 L-12,-8 L-34,-10 L-56,-12 L-78,-10 Z" fill="url(#carGrad)" stroke="#E10600" stroke-width="1.5" opacity="0.7"/>
      <ellipse cx="-55" cy="6" rx="8" ry="4" fill="#0a0a0a" stroke="#333"/>
      <ellipse cx="70" cy="6" rx="8" ry="4" fill="#0a0a0a" stroke="#333"/>
    </g>
  </g>
  <!-- Tercera estela - coche inferior -->
  <g transform="translate(0,0)" opacity="0.35">
    <path d="M-40,720 L550,720" stroke="#E10600" stroke-width="65" fill="none" stroke-linecap="round" opacity="0.22"/>
    <path d="M60,718 L530,718" stroke="#E10600" stroke-width="2" fill="none" opacity="0.14"/>
    <g transform="translate(420,720) scale(1.7)">
      <path d="M-78,-10 L-56,-14 L-34,-16 L-12,-16 L10,-14 L28,-10 L38,-6 L48,-2 L58,0 L68,0 L78,-2 L86,-6 L92,-10 L96,-12 L98,-10 L96,-6 L86,-2 L76,2 L66,4 L56,6 L46,6 L36,4 L26,0 L16,-4 L6,-8 L-12,-8 L-34,-10 L-56,-12 L-78,-10 Z" fill="url(#carGrad)" stroke="#E10600" stroke-width="1" opacity="0.6"/>
      <ellipse cx="-55" cy="6" rx="8" ry="4" fill="#0a0a0a"/>
      <ellipse cx="70" cy="6" rx="8" ry="4" fill="#0a0a0a"/>
    </g>
  </g>
  <!-- Logo F1 estilo oficial -->
  <g transform="translate(960,540)" opacity="0.12">
    <text x="0" y="0" font-family="Arial Black, sans-serif" font-size="360" font-weight="900" fill="#E10600" text-anchor="middle" dominant-baseline="middle">F1</text>
  </g>
  <!-- Franjas diagonales estilo logo F1 -->
  <g opacity="0.05">
    <rect x="-50" y="0" width="6" height="1200" fill="#E10600" transform="rotate(-15 960 540)"/>
    <rect x="100" y="0" width="4" height="1200" fill="#E10600" transform="rotate(-15 960 540)"/>
    <rect x="250" y="0" width="4" height="1200" fill="#E10600" transform="rotate(-15 960 540)"/>
    <rect x="1670" y="0" width="6" height="1200" fill="#E10600" transform="rotate(-15 960 540)"/>
    <rect x="1820" y="0" width="4" height="1200" fill="#E10600" transform="rotate(-15 960 540)"/>
  </g>
</svg>
